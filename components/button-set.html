<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button set</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family:arial, sans-serif;
        }

        h2 {
            color: darkblue;
            font-size:20px;
        }

        .btn{
            display:inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight:bold;
            text-decoration:none;
        }

            .button-group .btn {
            margin-right: 10px;
            margin-bottom: 10px;
        }


        .btn-primary{
            background-color: rgb(0, 123, 255);
            color: rgba(255, 255, 255, 1);
        }

        .btn-secondary{
            background-color: pink; 
        }

        .btn-outline{
            background-color: white;
            border: 2px solid black;    
        }

        .btn-secondary, .btn-outline {
            color: rgba(0, 0, 0, 0.8);
        }
        .btn-send{
            background-color: orange;
        }

        .btn-primary:hover{
            background-color:rgb(0, 102, 204);  
        }

        .btn-secondary:hover{
            background-color: rgb(255, 166, 180);
        }

        .btn-outline:hover{
            background-color: rgb(240, 240, 240);
        }

        .btn-send:hover{
            background-color: rgb(230,138,0);
        }


    </style>
</head>
<body>

    <main>

        <h2>Pilihan Menu dan Aksi</h2>
        
        <div class="button-group">
            <a href="#" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="#" class="btn btn-outline">Hubungi Saya</a>
            <a href="#" class="btn btn-send">Kirim Pesan</a>
        </div>

    </main>

    <footer>
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
