<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <!-- Jika box-sizing tidak diterapkan: 320px + padding 40px + border 4px = 364px -->
    <style>

        /* Mengatur ukuran kotak yang hanya boleh selebar lebar yang dipilih, tidak boleh melebihi border untuk semua elemen*/
        *{
            box-sizing: border-box;
        }

        /* Mengatur margin, warna latar belakang, dan font dari semua elemen dalam body */
        body{
            margin:0;
            background-color: #F0F8FF;
            font-family: Arial, sans-serif;
        }

        /* Mengatur lebar kartu, menambah padding, menambah border, dan menambah margin */
        .card{
            width: 320px;
            padding: 20px;
            border: 2px solid #260b5e;
            margin: 30px auto;
        }

        /* Mengatur lebar gambar, tingginya, dan cara penampilannya */
        .card img{
            width:100%;
            height:160px;
            display: block;
        }

        /* Mengatur warna font dan menambahkan jarak di bawah */
        .card h3{
            color: #260b5e;
            margin-bottom: 8px;
        }

        /*Mengatur font card <p> dan card <a> */
        .card p,.card a{
            font-size:15px;
        }


        
    </style>
</head>
<body>
    <!-- Isi kartu proyek -->
    <main>
        <div class="card"> 
            <img src="/assets/images/Bongkar_Laptop.jpeg" alt="Gambar Membongkar Laptop">

            <h3>Upgrade RAM dan SSD Laptop</h3>

            <p> Ini adalah proyek saya dengan teman saya meningkatkan kapasitas RAM dan SSD laptop saya.
                Kami membongkar laptop bersama-sama dan ini adalah salah satu foto dokumentasi dari kegiatan kami.
            </p>

            <a href="#">Lihat Proyek</a>
        </div>
    </main>

    <!-- Tombol footer "Kembali ke Beranda" -->
     <footer>
        <a href="/index.html">Kembali ke Beranda</a>
     </footer>

</body>
</html>
