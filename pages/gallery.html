<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Proyek</title>

    <!-- Menghubungkan file ini ke CSS -->
    <link rel="stylesheet" href="../styles/gallery.css">
</head>
<body>
    <main>

        <!-- Menambahkan 6 Gambar, dan menambah judul gambarnya -->
        <section id="gallery">
            <h2>Galeri Proyek</h2>

            <div class="gallery">

            <article class="gallery-item">

            </article>

            <article class="gallery-item">
                <img src="../assets/images/Halaman_Resep.jpg" alt="Gambar Halaman Resep">

            </article>

            <article class="gallery-item">
                <img src="../assets/images/Portofolio_Foto.jpg" alt="Gambar Portofolio Foto">

    <!-- Menambah footer dan mengatur tempatnya -->
    <footer>
